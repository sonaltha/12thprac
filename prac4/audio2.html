<!DOCTYPE html>
<html>

<head>
    <title>Multiple Audio Files with Controls</title>
</head>

<body>

    <h1 align="center">Multiple Audio Files with Controls</h1>

    <h2>
        The text between the audio tags will only be displayed in browsers
        that do not support the audio element.
    </h2>

    <h3>List of Sound File Formats</h3>

    <ol>
        <li>MP3 - audio/mpeg</li>
        <li>OGG - audio/ogg</li>
        <li>WAV - audio/wav</li>
    </ol>

    <audio controls autoplay>
        <source src="music1.mp3" type="audio/mpeg">
        <source src="music2.wav" type="audio/wav">
        <source src="music3.ogg" type="audio/ogg">
        Your browser does not support the audio element.
    </audio>

</body>

</html>
